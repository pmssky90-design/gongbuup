<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
{{og_image_meta}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
{{twitter_image_meta}}
{{preload_image}}
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: {{background_color}}; color: #eee; }
    body { font-family: Arial, "Malgun Gothic", sans-serif; }
    main { width: calc(100% - 32px); max-width: {{max_width}}px; margin: 0 auto; background: #181818; }
    figure { position: relative; min-height: 180px; margin: 0; background: #252525; }
    figure::before { content: "이미지 준비 중"; position: absolute; inset: 0; display: grid; place-items: center; color: #888; }
    img { position: relative; display: block; width: 100%; height: auto; min-height: 180px; object-fit: cover; background: #252525; }
    .seo { padding: 20px 24px 32px; color: #ccc; font-size: 14px; line-height: 1.75; }
    h1 { margin: 0 0 12px; color: #fff; font-size: 22px; line-height: 1.4; }
    p { margin: 0; white-space: pre-line; }
    @media (max-width: 720px) { main { width: 100%; } .seo { padding-inline: 18px; } }
  </style>
</head>
<body>
  <main>
{{image_blocks}}
    <div class="seo">
      <h1>{{keyword}}</h1>
      <p>{{body_html}}</p>
    </div>
  </main>
</body>
</html>
